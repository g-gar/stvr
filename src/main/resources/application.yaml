spring:
    devtools:
        livereload:
            enabled: false
    neo4j:
        uri: bolt://localhost:7687
        authentication:
            username: neo4j
            password: password # CHANGE THIS

logging:
    level:
        com.ggar.streamlink: INFO
        org.springframework.data.neo4j: INFO # Muestra las consultas Cypher generadas
        org.neo4j.driver.session: INFO # Muestra información de la sesión y la consulta

streamlink:
    command-template: 'docker container exec streamlink /bin/bash -c "streamlink ${url} --json"'
    stream-capture-template: 'docker container exec streamlink /bin/bash -c "streamlink ${url} ${quality} --stdout --stream-segment-threads 10"'
    capture:
        path: /home/ubuntu/Documents/cb
